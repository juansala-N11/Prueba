<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de números</title>
</head>
<body>

<script>
    let contador = 0;
    let numero = 0;

    while (numero <= 0) {
        numero = parseInt(prompt("Ingrese un número positivo:"));
        contador++;
    }

    document.write("El número ingresado es positivo.<br>");
    document.write("Ingresó " + contador + " número(s).");
</script>

</body>
</html>
