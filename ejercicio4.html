<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
</head>
<body>

<script>

let numero = parseInt(prompt("Ingrese un número:"));

if(numero > 0){
    document.write("El número es POSITIVO");
}else if(numero < 0){
    document.write("El número es NEGATIVO");
}else{
    document.write("El número es CERO");
}

</script>

</body>
</html>
